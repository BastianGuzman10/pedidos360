services:

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pedidos360
      SPRING_DATASOURCE_USERNAME: pedidos360
      SPRING_DATASOURCE_PASSWORD: pedidos360_local_only
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: pedidos360
      SPRING_RABBITMQ_PASSWORD: pedidos360_rabbit_local

      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-}
      OAUTH2_AUDIENCE: ${OAUTH2_AUDIENCE:-PLACEHOLDER_API_CLIENT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8081}

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy


  notification-service:
    build: ./notification-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: pedidos360
      SPRING_RABBITMQ_PASSWORD: pedidos360_rabbit_local
    depends_on:
      rabbitmq:
        condition: service_healthy


  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pedidos360
      POSTGRES_USER: pedidos360
      POSTGRES_PASSWORD: pedidos360_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos360 -d pedidos360"]
      interval: 5s
      timeout: 5s
      retries: 10


  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: pedidos360
      RABBITMQ_DEFAULT_PASS: pedidos360_rabbit_local
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq


  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        ANGULAR_CONFIGURATION: development
    ports:
      - "8081:80"
    depends_on:
      - backend


volumes:
  rabbitmq_data: