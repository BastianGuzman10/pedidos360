services:

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pedidos360
      SPRING_DATASOURCE_USERNAME: pedidos360
      SPRING_DATASOURCE_PASSWORD: pedidos360_local_only
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: pedidos360
      SPRING_RABBITMQ_PASSWORD: pedidos360_rabbit_local

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_PEDIDOS_TOPIC: pedidos.eventos
      KAFKA_AUDITORIA_TOPIC: pedidos.auditoria

      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-}
      OAUTH2_AUDIENCE: ${OAUTH2_AUDIENCE:-PLACEHOLDER_API_CLIENT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8081}

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy


  notification-service:
    build: ./notification-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: pedidos360
      SPRING_RABBITMQ_PASSWORD: pedidos360_rabbit_local
    depends_on:
      rabbitmq:
        condition: service_healthy


  reporting-service:
    build: ./reporting-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_PEDIDOS_TOPIC: pedidos.eventos
      KAFKA_REPORTING_GROUP: pedidos-reporteria
    depends_on:
      kafka:
        condition: service_healthy


  audit-service:
    build: ./audit-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_AUDITORIA_TOPIC: pedidos.auditoria
      KAFKA_AUDIT_GROUP: pedidos-auditoria
    depends_on:
      kafka:
        condition: service_healthy


  kafka-admin-service:
    build: ./kafka-admin-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy


  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pedidos360
      POSTGRES_USER: pedidos360
      POSTGRES_PASSWORD: pedidos360_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos360 -d pedidos360"]
      interval: 5s
      timeout: 5s
      retries: 10


  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: pedidos360
      RABBITMQ_DEFAULT_PASS: pedidos360_rabbit_local
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq


  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep Zookeeper"]
      interval: 10s
      timeout: 5s
      retries: 10


  kafka:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
    depends_on:
      zookeeper:
        condition: service_healthy
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports:
      - "8086:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      kafka:
        condition: service_healthy


  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        ANGULAR_CONFIGURATION: development
    ports:
      - "8081:80"
    depends_on:
      - backend


volumes:
  rabbitmq_data:
  kafka_data:
