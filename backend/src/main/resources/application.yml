spring:
  application:
    name: pedidos360-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:pedidos360;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    admin:
      auto-create: true
      fail-fast: false
      operation-timeout: 5s
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  security:
    enabled: ${AUTH_ENABLED:true}
    issuer-uri: ${OAUTH2_ISSUER_URI:}
    audience: ${OAUTH2_AUDIENCE:PLACEHOLDER_API_CLIENT_ID}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  kafka:
    pedidos-topic: ${KAFKA_PEDIDOS_TOPIC:pedidos.eventos}
    auditoria-topic: ${KAFKA_AUDITORIA_TOPIC:pedidos.auditoria}
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
